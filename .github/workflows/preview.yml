name: Build and publish preview (GitHub Pages)
# Every push to the migration branch rebuilds the site and publishes it to the
# gh-pages branch, which GitHub Pages serves at
#   https://dionpather-afk.github.io/charishub-website/
# This is a test preview only: it is hidden from search engines, and the
# contact form cannot send there (GitHub Pages does not run PHP).
on:
  push:
    branches: [migration/xneelo]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: preview
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run build
        env:
          SITE_BASE: /charishub-website/
          SITE_INDEXING: 'off'   # preview copy must never compete with the live site in Google
      - name: Page text snapshot for AI tools and crawlers (AEO)
        run: |
          pip install playwright==1.* >/dev/null
          python -m playwright install --with-deps chromium >/dev/null
          python tools/snapshot-pages.py dist /charishub-website/
      - name: Publish to gh-pages branch
        run: |
          cd dist
          touch .nojekyll
          cp index.html 404.html
          git init -q -b gh-pages
          git config user.name "preview-bot"
          git config user.email "preview-bot@users.noreply.github.com"
          git add -A
          git commit -qm "Preview build of ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

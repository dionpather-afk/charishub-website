name: Harvest missing screenshots
on:
  workflow_dispatch:
    inputs:
      site:
        description: Live Wix site address
        default: https://www.rcacharisma.com
permissions:
  contents: write
jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install tools
        run: |
          mkdir -p /tmp/h
          cp harvest-missing.mjs /tmp/h/
          cd /tmp/h
          npm init -y
          npm pkg set type=module
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Switch to results branch
        run: git checkout harvest/wix-assets
      - name: Retry missing screenshots
        run: node /tmp/h/harvest-missing.mjs
        env:
          SITE: ${{ inputs.site }}
          OUT: ${{ github.workspace }}/migration/harvest
      - name: Save results
        run: |
          git config user.name "migration-bot"
          git config user.email "migration-bot@users.noreply.github.com"
          git add -f migration/harvest
          git commit -m "Add missing Wix screenshots" || echo "Nothing new to save"
          git push origin harvest/wix-assets
